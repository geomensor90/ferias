<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Férias — Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.2.2/dist/frappe-gantt.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Férias</h1>
    </div>
    <div class="topbar-right">
      <span id="papel-badge" class="badge"></span>
      <button id="btn-backup" class="btn-secondary hidden">Baixar backup (.txt)</button>
      <button id="btn-logout" class="btn-ghost">Sair</button>
    </div>
  </header>

  <main class="painel">

    <!-- Seletor de equipe -->
    <section class="card equipe-card">
      <span class="equipe-label">Equipe</span>
      <div class="switch-equipe" id="switch-equipe">
        <button type="button" class="switch-option" data-equipe="AHAB">AHAB</button>
        <button type="button" class="switch-option" data-equipe="ACESS">ACESS</button>
      </div>
    </section>

    <!-- Formulário do gestor -->
    <section id="form-gestor" class="card form-card hidden">
      <h2 id="form-title">Agendar férias</h2>
      <form id="ferias-form">
        <label for="select-funcionario">Funcionário</label>
        <select id="select-funcionario" required></select>

        <div class="row">
          <div>
            <label for="data-inicio">Data inicial</label>
            <input type="date" id="data-inicio" required />
          </div>
          <div>
            <label for="data-fim">Data final</label>
            <input type="date" id="data-fim" required />
          </div>
        </div>

        <div class="row form-actions">
          <button type="submit" id="btn-salvar">Agendar</button>
          <button type="button" id="btn-cancelar-edicao" class="btn-ghost hidden">Cancelar edição</button>
        </div>
        <p id="form-msg" class="error-msg"></p>
      </form>
    </section>

    <!-- Calendário / Gantt -->
    <section class="card">
      <div class="card-header-row">
        <div class="legend">
          <span class="legend-dot"></span>
          <span id="legend-text">Dia com férias marcadas</span>
        </div>
        <div class="switch-visao" id="switch-visao">
          <button type="button" class="switch-option" data-visao="calendario">📅 Calendário</button>
          <button type="button" class="switch-option" data-visao="gantt">📊 Gráfico Gantt</button>
        </div>
      </div>

      <p class="aviso-limite" id="aviso-limite">⚠️ Atenção, permitido apenas 5 auditores de férias ao mesmo tempo na AHAB e 1 na ACESS</p>

      <div id="calendar"></div>
      <div id="tooltip-info" class="tooltip-info hidden"></div>
      <div id="gantt-wrap" class="hidden">
        <svg id="gantt"></svg>
      </div>
    </section>

    <!-- Visão geral com filtros -->
    <section class="card">
      <h2>Visão geral</h2>
      <div class="filtros-geral">
        <div>
          <label for="filtro-mes">Mês</label>
          <select id="filtro-mes"></select>
        </div>
        <div id="filtro-auditor-wrap" class="hidden">
          <label for="filtro-auditor">Auditor</label>
          <select id="filtro-auditor"></select>
        </div>
      </div>
      <div id="visao-geral-lista"></div>
    </section>

    <!-- Lista de períodos (só gestor) -->
    <section id="lista-gestor" class="card hidden">
      <h2>Períodos agendados</h2>
      <div id="lista-periodos"></div>
    </section>

    <!-- Configurações (só gestor) -->
    <section id="config-gestor" class="card hidden">
      <h2>Configurações</h2>

      <div class="config-equipe-bloco">
        <h3>AHAB</h3>
        <label for="config-limite-AHAB">Quantidade máxima de pessoas de férias ao mesmo tempo antes de ficar vermelho</label>
        <input type="number" id="config-limite-AHAB" min="0" />
        <label class="config-checkbox">
          <input type="checkbox" id="config-nomes-AHAB" />
          Mostrar nomes das pessoas de férias para o perfil auditor
        </label>
        <button type="button" class="btn-salvar-config" data-equipe="AHAB">Salvar AHAB</button>
      </div>

      <div class="config-equipe-bloco">
        <h3>ACESS</h3>
        <label for="config-limite-ACESS">Quantidade máxima de pessoas de férias ao mesmo tempo antes de ficar vermelho</label>
        <input type="number" id="config-limite-ACESS" min="0" />
        <label class="config-checkbox">
          <input type="checkbox" id="config-nomes-ACESS" />
          Mostrar nomes das pessoas de férias para o perfil auditor
        </label>
        <button type="button" class="btn-salvar-config" data-equipe="ACESS">Salvar ACESS</button>
      </div>

      <p id="config-msg" class="error-msg"></p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.2.2/dist/frappe-gantt.umd.js"></script>
  <script src="assets/supabaseClient.js"></script>
  <script src="assets/painel.js"></script>
</body>
</html>
